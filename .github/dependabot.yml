version: 2
updates:
  # Root Next.js app (npm)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Collapse the noisy minor/patch churn into one PR per week.
      app-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node must track the Node runtime (Node 20). Take minor/patch,
      # but not majors that jump ahead of the runtime (e.g. v25).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript majors (e.g. 6.0) carry breaking compiler changes — adopt
      # deliberately, not via an automated bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # pdfjs-dist is a dead dependency (the PDF domain was removed; no imports
      # remain). Stop bumping it; remove the dep in a separate deliberate PR.
      - dependency-name: "pdfjs-dist"
    labels:
      - dependencies
    commit-message:
      prefix: "deps"

  # AWS CDK infra (npm)
  - package-ecosystem: npm
    directory: "/infra"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      infra-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
      - infra
    commit-message:
      prefix: "deps(infra)"

  # GitHub Actions used by the CI/deploy workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-all:
        patterns:
          - "*"
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"
