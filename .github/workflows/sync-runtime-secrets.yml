name: Sync runtime secrets to SSM

# One-shot/maintenance: copies the five runtime secrets (see
# infra/lib/frontend-runtime-config.ts FRONTEND_SSM_RUNTIME_SECRET_NAMES) from
# the GitHub environment into SecureString parameters under /chapterflow/<env>/:
# BOOK_STRIPE_SECRET_KEY, BOOK_STRIPE_WEBHOOK_SECRET, ANTHROPIC_API_KEY,
# AUTH_STATE_SECRET (required) and ELEVENLABS_API_KEY (optional, chapter audio).
# The server reads them from there and refuses to start without the required
# ones. Values are written straight from the runner's env to SSM by
# scripts/ci/sync-runtime-secrets.sh — never echoed, never persisted anywhere
# else.
#
# The default mode "missing" only adds parameters that do not exist yet and
# keeps every existing value as it is. After changing a secret in the GitHub
# environment, run with mode "overwrite" to replace the stored values. Either
# way, redeploy the app afterwards: running servers keep the values they read
# at start (a fresh Lambda cold start re-hydrates).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: prod
      mode:
        description: "missing = add only parameters that do not exist yet, keep existing values; overwrite = replace every value with the GitHub environment's"
        type: choice
        options: [missing, overwrite]
        default: missing

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    name: Sync (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write SecureString parameters
        env:
          BOOK_STRIPE_SECRET_KEY: ${{ secrets.BOOK_STRIPE_SECRET_KEY }}
          BOOK_STRIPE_WEBHOOK_SECRET: ${{ secrets.BOOK_STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          TARGET_ENV: ${{ inputs.environment }}
          SYNC_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          bash scripts/ci/sync-runtime-secrets.sh "/chapterflow/${TARGET_ENV}"
