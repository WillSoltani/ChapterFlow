name: Sync runtime secrets to SSM

# One-shot/maintenance: copies the four ssm_runtime secrets (see
# app/app/api/_lib/boot-env-core.ts RUNTIME_ENV_REQUIREMENTS) from the GitHub
# environment into SecureString parameters under /chapterflow/<env>/. The
# server Lambda hydrates them at boot; WS3-012's fail-fast contract makes the
# app refuse to serve without them. Values are written straight from the
# runner's env to SSM — never echoed, never persisted anywhere else.
#
# Run after rotating any of these secrets in the GitHub environment, then
# redeploy the app (a fresh Lambda cold start re-hydrates).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, prod]
        default: prod

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  sync:
    name: Sync (${{ inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Write SecureString parameters
        env:
          BOOK_STRIPE_SECRET_KEY: ${{ secrets.BOOK_STRIPE_SECRET_KEY }}
          BOOK_STRIPE_WEBHOOK_SECRET: ${{ secrets.BOOK_STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          prefix="/chapterflow/${TARGET_ENV}"
          fail=0
          for name in BOOK_STRIPE_SECRET_KEY BOOK_STRIPE_WEBHOOK_SECRET ANTHROPIC_API_KEY AUTH_STATE_SECRET; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::${name} is empty in the ${TARGET_ENV} environment — set it before syncing"
              fail=1
              continue
            fi
            aws ssm put-parameter \
              --name "${prefix}/${name}" \
              --type SecureString \
              --overwrite \
              --value "$value" > /dev/null
            echo "synced ${prefix}/${name}"
          done
          exit "$fail"
