name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hard gate: typecheck + tests + Next.js build + OpenNext bundle ────────
  app-checks:
    name: App Build + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders so server modules that read config don't throw
      # during `next build`. Real values are injected at deploy time.
      COGNITO_REGION: "us-east-1"
      COGNITO_USER_POOL_ID: "ci-user-pool"
      BOOK_TABLE_NAME: "ci-table"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'lib/**/*.ts', 'lib/**/*.tsx', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: TypeScript boundary verifier tests
        run: npm run typecheck:boundary:test

      - name: Verify TypeScript project boundary
        run: npm run typecheck:boundary

      # Shared-closure policy is PR-relative. Push events have no exact PR base,
      # so they must not synthesize one or override the verifier's inferred mode.
      - name: Verify shared TypeScript closure
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: npm run typecheck:shared-closure -- --base "$PR_BASE_SHA"

      - name: Type-check app
        run: npm run typecheck:app

      - name: Unit tests
        run: npm run test

      - name: Critical unit code coverage
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-text.txt
          test -s coverage/lcov.info
          test -s coverage/coverage-summary.json
          test -s coverage/coverage-final.json
          test -s coverage/inventory.json

      - name: Upload unit code-coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-code-coverage
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/coverage-final.json
            coverage/inventory.json
            coverage-text.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Build app
        run: npm run build

      - name: Build OpenNext
        run: npx open-next build

  # ── Lambda handler unit tests ─────────────────────────────────────────────
  # infra/lambda has its own package.json (aws-sdk-client-mock + tsx) and is NOT
  # covered by the app's `npm run test` glob (app/, lib/, components/, tests/). Run it here so
  # the cron sub-handlers (e.g. the commitment follow-up exactly-once logic) are
  # regression-gated on every PR — the deploy workflow only bundles them.
  lambda-checks:
    name: Lambda Handler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Lambda unit tests
        working-directory: infra
        run: npm test

      # The reminder cron / suppression handler / cognito pre-signup linker deploy
      # from infra/lambda/dist via CDK fromAsset. Rebuild those bundles from source
      # here (mirrors _deploy-infra.yml's "Build Lambda bundles" step) so a PR that
      # edits a lambda .ts source without regenerating dist fails CI instead of
      # deploying stale code.
      - name: Build Lambda bundles
        working-directory: infra
        run: |
          set -euo pipefail
          npx esbuild lambda/reading-reminder-cron.ts --bundle --platform=node \
            --target=node20 --outfile=lambda/dist/reading-reminder-cron.js \
            --external:@aws-sdk/client-dynamodb --external:@aws-sdk/lib-dynamodb \
            --external:@aws-sdk/client-sesv2 --external:@aws-sdk/client-ssm
          npx esbuild lambda/suppression-handler.ts --bundle --platform=node \
            --target=node20 --outfile=lambda/dist/suppression-handler.js \
            --external:@aws-sdk/client-dynamodb --external:@aws-sdk/lib-dynamodb
          npx esbuild lambda/cognito-pre-signup.ts --bundle --platform=node \
            --target=node20 --outfile=lambda/dist/cognito-pre-signup.js \
            --external:@aws-sdk/client-cognito-identity-provider

      - name: Verify Lambda bundle freshness
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- infra/lambda/dist; then
            echo "::error::infra/lambda/dist is stale — rebuild with the esbuild commands in this job and commit the output"
            exit 1
          fi

  # ── Hard gate: v21 pipeline workspace package ───────────────────────────
  # This runs from the same clean checkout and root package-lock as the app.
  # The pipeline tests force no-API mode and use synthetic fixtures only.
  pipeline-checks:
    name: v21 Pipeline Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAPTERFLOW_NO_API_CODEX_QC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Type-check book project
        run: npm run typecheck:book

      - name: Pipeline typecheck
        run: npm run pipeline:typecheck

      - name: Pipeline tests
        run: npm run pipeline:test

      - name: Pipeline doctor
        run: npm run pipeline:doctor

      - name: Pipeline build
        run: npm run pipeline:build

  # ── Non-required: golden-journey integration test (DynamoDB Local) ────────
  # PR-G / issue #17. Drives the REAL repo modules (entitlement reserve, quiz
  # outcome transaction, flow-points award, account-status, webhook idempotency,
  # effective-plan computation) against a hermetic DynamoDB Local — NO OIDC, NO
  # AWS account, NO S3. The app's DynamoDB client honours AWS_ENDPOINT_URL_DYNAMODB
  # at construction, so prod code talks to the local container with no source edit.
  #
  # NON-REQUIRED (continue-on-error) for now: keep it OUT of branch-protection
  # required checks (canonical list: .github/rulesets/main-branch.json);
  # promote to required after N consecutive green runs.
  integration-journey:
    name: Integration — Golden Journey (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_ENDPOINT_URL_DYNAMODB: "http://127.0.0.1:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      BOOK_TABLE_NAME: "ChapterFlowApp-itest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Wait for DynamoDB Local
        run: |
          # DynamoDB Local answers a bare GET with HTTP 400, so `curl -f` (which
          # exits non-zero on >=400) would NEVER succeed and the probe would
          # silently "time out" while the service was actually up — skipping the
          # whole test step. Probe WITHOUT -f: curl exits 0 as soon as the port
          # answers at all (even a 400), which is exactly "the service is up".
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:8000"; then
              echo "DynamoDB Local is up"; exit 0
            fi
            echo "waiting for DynamoDB Local ($i)..."; sleep 1
          done
          echo "DynamoDB Local did not become reachable"; exit 1

      - name: Run integration tests
        run: npm run test:integration

  # ── Smoke gate (DEV BUILD ONLY): drive the app in a browser (Playwright) ──
  # SCOPE WARNING (M51): this job runs the app via `npm run dev` — the Turbopack
  # DEV server with DEV_AUTH_BYPASS=1 and no data plane. It verifies that the
  # authed app SHELL renders, but with auth BYPASSED and NO DynamoDB. It does
  # NOT exercise the production bundle, real-auth redirects, or DynamoDB-backed
  # pages — do not mistake a green here for prod-build coverage. The prod bundle
  # is browser-driven by the separate `e2e-prod` job below.
  e2e:
    name: E2E Smoke (dev build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Intentionally NO data-plane env (BOOK_TABLE_NAME, Cognito): the smokes run
      # the app in local-dev mode (DEV_AUTH_BYPASS via `npm run dev`), where the
      # data plane is absent and pages degrade gracefully. Setting BOOK_TABLE_NAME
      # to a placeholder instead makes /book attempt a real DynamoDB call and 500.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E smoke tests (dev bypass)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Smoke gate (PROD BUILD): browser-drive the production bundle ──────────
  # M51: builds the app with `next build` and serves it with `next start`
  # (NODE_ENV=production, DEV_AUTH_BYPASS has no effect), then runs the "@prod"
  # Playwright specs. This catches prod-build-only crashes / hydration drift the
  # dev job hides, and asserts the REAL middleware auth bounce (unauthenticated
  # protected route -> /auth/login), which is invisible under dev auth-bypass.
  # Test-only placeholders satisfy the production boot contract and make
  # middleware run its real auth check. The suite stays data-plane-free because
  # every protected request stops at the unauthenticated redirect before a DB
  # read. A DynamoDB-backed page smoke would need a disposable test backend and
  # is a follow-up.
  e2e-prod:
    name: E2E Smoke (prod build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_MODE: "prod"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E smoke tests (prod bundle)
        # playwright.config.ts (E2E_MODE=prod) runs `next build` + `next start`
        # via its webServer and greps the "@prod" specs.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 7

  # ── Advisory: lint (known in-scope debt — reports, never blocks) ─────────
  # NOTE: keep this OUT of the required status checks in branch protection
  # (canonical list: .github/rulesets/main-branch.json).
  # The web-app lint surface (app/, components/, lib/) carries pre-existing
  # debt; this job surfaces it without blocking merges/deploys. Pay it down
  # over time, then promote to a hard gate.
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: ESLint (advisory)
        run: |
          set +e
          npx eslint . --format stylish | tee eslint.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Lint (advisory)"
            echo ""
            if [ "$STATUS" -eq 0 ]; then
              echo "No lint problems in app/components/lib. ✅"
            else
              echo "ESLint reported problems (advisory — does not block):"
              echo ""
              echo '```'
              tail -n 20 eslint.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Book-cover asset coverage (advisory)
        run: |
          set +e
          npx tsx scripts/ci/check-cover-coverage.ts --warn-only 2>&1 | tee cover.log
          {
            echo "## Book-cover asset coverage (advisory)"
            echo ""
            echo '```'
            cat cover.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ── Hard gate: ESLint ratchet (L89) — fails only on NEW correctness debt ──
  # The advisory `lint` job never blocks, `next build` does not run ESLint, and
  # nothing else enforces JS/TS correctness lint — so correctness regressions
  # (exhaustive-deps, floating promises, unused error handlers, prefer-const,
  # etc.) can ship freely and the debt baseline can grow unbounded.
  #
  # This mirrors the repo's existing baseline model (scan-style-drift's
  # allowlist): a committed snapshot of the CURRENT error count below. The job
  # counts ESLint *errors* (severity 2) and fails ONLY when the count exceeds
  # the baseline — i.e. on NEW errors. It does not force a big-bang cleanup; as
  # debt is paid down, ratchet the baseline LOWER (it must never go up).
  #
  # Baseline recaptured 2026-07-22 (WS6-015, `npx eslint . --format json`): 7
  # errors — @typescript-eslint/no-explicit-any (1) + react-hooks/set-state-in-effect
  # (6), all pre-existing. WS6-015 also elevated react-hooks/exhaustive-deps and
  # @typescript-eslint/no-unused-vars from eslint-config-next's default "warn" to
  # "error" (eslint.config.mjs) and fixed every case that surfaced (54 unused-vars +
  # 14 exhaustive-deps sites); @typescript-eslint/no-floating-promises was left at
  # its default (unset) since it requires type-aware linting
  # (parserOptions.projectService) whose lint-time cost hasn't been measured yet —
  # deferred, not part of this ratchet's correctness subset. check-eslint-
  # correctness.mjs (findCorrectnessHits) checks that elevated subset at ZERO
  # tolerance (plus the never-elevated no-unused-vars/no-floating-promises
  # aliases), independent from the overall baseline comparison. As of
  # WS6-021's final-audit-remainder fix, scripts/ci/lint-ratchet.mjs imports
  # and runs findCorrectnessHits() inline against the same parsed report, so
  # `npm run lint:ratchet`/`npm run verify` locally exercise the correctness
  # subset identically to CI, not just the baseline count. The "ESLint
  # correctness subset" step below is a redundant, explicit re-check of the
  # same eslint-report.json — kept for its own line in the Actions UI and as
  # defense in depth, not because local verify misses it anymore.
  #
  # WS6-021: the baseline count and the count/compare logic both live in
  # scripts/ci/lint-ratchet.mjs (baseline read from the committed
  # scripts/ci/eslint-error-baseline file, not a workflow env var), so `npm run
  # lint:ratchet`/`npm run verify` locally and this job can never drift from
  # each other — see docs/CI_CD.md §3/§6 for the verify↔CI delta.
  lint-ratchet:
    name: Lint Ratchet (no new errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      # Explicit source globs bypass the app-only global ignores while keeping
      # generated infra output and the offline scripts/book pipeline excluded.
      - name: Infra and CI-source ESLint
        run: npm run lint:infra-ci

      - name: ESLint ratchet
        run: node scripts/ci/lint-ratchet.mjs

      # WS6-015: zero-tolerance correctness-rule subset — runs regardless of
      # whether the step above already failed the job, so a PR that both
      # exceeds the baseline AND introduces a correctness-rule hit reports
      # both instead of only the first failure. Reads the same
      # eslint-report.json the "ESLint ratchet" step above writes.
      - name: ESLint correctness subset (zero tolerance)
        if: ${{ !cancelled() }}
        run: node scripts/ci/check-eslint-correctness.mjs eslint-report.json

  # ── Hard gate: CDK synth (backend) for the dev environment ───────────────
  infra-checks:
    name: Infra Build + CDK Synth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        run: npm ci

      - name: Build infra TypeScript
        run: npm run build

      # Frontend stack (CloudFront + Route53 + custom domain) requires OpenNext
      # build artifacts on disk (bin/app.ts auto-skips it here without them),
      # so it isn't synthed from this backend-only context. Its prod-shaped and
      # staging-shaped synth coverage instead lives in the infra test suite
      # (frontend-stack-prod-synth.test.ts, run by lambda-checks) against a
      # non-secret stub .open-next/ fixture.
      - name: CDK synth (backend, dev context)
        run: npm run cdk -- synth -c env=dev ChapterFlowBackend-dev

      - name: CDK synth (backend, staging context)
        run: npm run cdk -- synth -c env=staging ChapterFlowBackend-staging

      - name: CDK synth (backend, prod context)
        env:
          CHAPTERFLOW_APP_BASE_URL: https://app.chapterflow.ca
        run: npm run cdk -- synth -c env=prod ChapterFlowBackend

  # ── Hard gate: no committed build artifacts or hardcoded secrets ─────────
  # Public repo. A committed Turbopack cache once leaked a live Stripe key;
  # this is the un-bypassable backstop for the local pre-commit hook.
  secret-artifact-scan:
    name: Secret & Artifact Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify detection patterns (selftest)
        run: bash scripts/ci/scan-secrets-and-artifacts.sh --selftest

      - name: Scan tracked files for secrets & artifacts
        run: bash scripts/ci/scan-secrets-and-artifacts.sh --all

  # ── Hard gate: design-system / token drift ──────────────────────────────
  # ESLint is advisory and `next build` does not lint, so this standalone guard
  # is the enforcement path for: dead Tailwind v4 `-[--x]` syntax, undeclared
  # --cf-/--cr- tokens, raw hex/rgba in components & app/book, and literal
  # catalog counts. (c)+(d) are baselined (style-drift-allowlist.txt) so only
  # NEW drift blocks. Already required (see .github/rulesets/main-branch.json,
  # the canonical required-status-checks list; apply via `gh api --method POST
  # /repos/WillSoltani/ChapterFlow/rulesets --input .github/rulesets/main-branch.json`).
  style-drift-scan:
    name: Style & Token Drift Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"

      - name: Verify detection patterns (selftest)
        run: node scripts/ci/scan-style-drift.mjs --selftest

      - name: Scan tracked files for style/token drift
        run: node scripts/ci/scan-style-drift.mjs --all
