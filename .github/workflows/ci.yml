name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Hard gate: typecheck + tests + Next.js build + OpenNext bundle ────────
  app-checks:
    name: App Build + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Build-time placeholders so server modules that read config don't throw
      # during `next build`. Real values are injected at deploy time.
      COGNITO_REGION: "us-east-1"
      COGNITO_USER_POOL_ID: "ci-user-pool"
      BOOK_TABLE_NAME: "ci-table"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json', 'app/**/*.ts', 'app/**/*.tsx', 'components/**/*.ts', 'components/**/*.tsx', 'next.config.ts', 'postcss.config.mjs') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build app
        run: npm run build

      - name: Build OpenNext
        run: npx open-next build

  # ── Lambda handler unit tests ─────────────────────────────────────────────
  # infra/lambda has its own package.json (aws-sdk-client-mock + tsx) and is NOT
  # covered by the app's `npm run test` glob (app/ + lib/ only). Run it here so
  # the cron sub-handlers (e.g. the commitment follow-up exactly-once logic) are
  # regression-gated on every PR — the deploy workflow only bundles them.
  lambda-checks:
    name: Lambda Handler Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        working-directory: infra
        run: npm ci

      - name: Lambda unit tests
        working-directory: infra
        run: npm test

  # ── Hard gate: v21 pipeline workspace package ───────────────────────────
  # This runs from the same clean checkout and root package-lock as the app.
  # The pipeline tests force no-API mode and use synthetic fixtures only.
  pipeline-checks:
    name: v21 Pipeline Typecheck + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAPTERFLOW_NO_API_CODEX_QC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Pipeline typecheck
        run: npm run pipeline:typecheck

      - name: Pipeline tests
        run: npm run pipeline:test

      - name: Pipeline doctor
        run: npm run pipeline:doctor

      - name: Pipeline build
        run: npm run pipeline:build

  # ── Non-required: golden-journey integration test (DynamoDB Local) ────────
  # PR-G / issue #17. Drives the REAL repo modules (entitlement reserve, quiz
  # outcome transaction, flow-points award, account-status, webhook idempotency,
  # effective-plan computation) against a hermetic DynamoDB Local — NO OIDC, NO
  # AWS account, NO S3. The app's DynamoDB client honours AWS_ENDPOINT_URL_DYNAMODB
  # at construction, so prod code talks to the local container with no source edit.
  #
  # NON-REQUIRED (continue-on-error) for now: keep it OUT of branch-protection
  # required checks; promote to required after N consecutive green runs.
  integration-journey:
    name: Integration — Golden Journey (DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      AWS_ENDPOINT_URL_DYNAMODB: "http://127.0.0.1:8000"
      AWS_REGION: "us-east-1"
      AWS_ACCESS_KEY_ID: "dummy"
      AWS_SECRET_ACCESS_KEY: "dummy"
      BOOK_TABLE_NAME: "ChapterFlowApp-itest"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Wait for DynamoDB Local
        run: |
          # DynamoDB Local answers a bare GET with HTTP 400, so `curl -f` (which
          # exits non-zero on >=400) would NEVER succeed and the probe would
          # silently "time out" while the service was actually up — skipping the
          # whole test step. Probe WITHOUT -f: curl exits 0 as soon as the port
          # answers at all (even a 400), which is exactly "the service is up".
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:8000"; then
              echo "DynamoDB Local is up"; exit 0
            fi
            echo "waiting for DynamoDB Local ($i)..."; sleep 1
          done
          echo "DynamoDB Local did not become reachable"; exit 1

      - name: Run integration tests
        run: npm run test:integration

  # ── Smoke gate (DEV BUILD ONLY): drive the app in a browser (Playwright) ──
  # SCOPE WARNING (M51): this job runs the app via `npm run dev` — the Turbopack
  # DEV server with DEV_AUTH_BYPASS=1 and no data plane. It verifies that the
  # authed app SHELL renders, but with auth BYPASSED and NO DynamoDB. It does
  # NOT exercise the production bundle, real-auth redirects, or DynamoDB-backed
  # pages — do not mistake a green here for prod-build coverage. The prod bundle
  # is browser-driven by the separate `e2e-prod` job below.
  e2e:
    name: E2E Smoke (dev build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Intentionally NO data-plane env (BOOK_TABLE_NAME, Cognito): the smokes run
      # the app in local-dev mode (DEV_AUTH_BYPASS via `npm run dev`), where the
      # data plane is absent and pages degrade gracefully. Setting BOOK_TABLE_NAME
      # to a placeholder instead makes /book attempt a real DynamoDB call and 500.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests (dev bypass)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── Smoke gate (PROD BUILD): browser-drive the production bundle ──────────
  # M51: builds the app with `next build` and serves it with `next start`
  # (NODE_ENV=production, DEV_AUTH_BYPASS has no effect), then runs the "@prod"
  # Playwright specs. This catches prod-build-only crashes / hydration drift the
  # dev job hides, and asserts the REAL middleware auth bounce (unauthenticated
  # protected route -> /auth/login), which is invisible under dev auth-bypass.
  # COGNITO_* placeholders make middleware run its real auth check; still NO
  # BOOK_TABLE_NAME, so this stays data-plane-free (the bounce happens before any
  # DB read). A DynamoDB-backed page smoke would need a disposable test backend
  # and is a follow-up.
  e2e-prod:
    name: E2E Smoke (prod build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      E2E_MODE: "prod"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests (prod bundle)
        # playwright.config.ts (E2E_MODE=prod) runs `next build` + `next start`
        # via its webServer and greps the "@prod" specs.
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: playwright-report/
          retention-days: 7

  # ── Advisory: lint (known in-scope debt — reports, never blocks) ─────────
  # NOTE: keep this OUT of the required status checks in branch protection.
  # The web-app lint surface (app/, components/, lib/) carries pre-existing
  # debt; this job surfaces it without blocking merges/deploys. Pay it down
  # over time, then promote to a hard gate.
  lint:
    name: Lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: ESLint (advisory)
        run: |
          set +e
          npx eslint . --format stylish | tee eslint.log
          STATUS=${PIPESTATUS[0]}
          {
            echo "## Lint (advisory)"
            echo ""
            if [ "$STATUS" -eq 0 ]; then
              echo "No lint problems in app/components/lib. ✅"
            else
              echo "ESLint reported problems (advisory — does not block):"
              echo ""
              echo '```'
              tail -n 20 eslint.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Cover coverage (advisory)
        run: |
          set +e
          npx tsx scripts/ci/check-cover-coverage.ts --warn-only 2>&1 | tee cover.log
          {
            echo "## Cover coverage (advisory)"
            echo ""
            echo '```'
            cat cover.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

  # ── Hard gate: ESLint ratchet (L89) — fails only on NEW correctness debt ──
  # The advisory `lint` job never blocks, `next build` does not run ESLint, and
  # nothing else enforces JS/TS correctness lint — so correctness regressions
  # (exhaustive-deps, floating promises, unused error handlers, prefer-const,
  # etc.) can ship freely and the debt baseline can grow unbounded.
  #
  # This mirrors the repo's existing baseline model (scan-style-drift's
  # allowlist): a committed snapshot of the CURRENT error count below. The job
  # counts ESLint *errors* (severity 2) and fails ONLY when the count exceeds
  # the baseline — i.e. on NEW errors. It does not force a big-bang cleanup; as
  # debt is paid down, ratchet the baseline LOWER (it must never go up).
  #
  # Baseline captured 2026-06-14 (`npx eslint . --format json`): 46 errors.
  lint-ratchet:
    name: Lint Ratchet (no new errors)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Committed baseline: the current ESLint error count. Lower this (never
      # raise it) as errors are fixed. New errors above this number block CI.
      ESLINT_ERROR_BASELINE: "46"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=optional

      - name: ESLint ratchet
        run: |
          set -uo pipefail
          npx eslint . --format json > eslint-report.json || true
          ERRORS=$(node -e "const r=require('./eslint-report.json');let e=0;for(const f of r)e+=f.errorCount;console.log(e);")
          echo "ESLint errors: ${ERRORS} (baseline: ${ESLINT_ERROR_BASELINE})"
          {
            echo "## ESLint ratchet"
            echo ""
            echo "- Current errors: \`${ERRORS}\`"
            echo "- Baseline: \`${ESLINT_ERROR_BASELINE}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${ERRORS}" -gt "${ESLINT_ERROR_BASELINE}" ]; then
            echo "::error::ESLint error count ${ERRORS} exceeds baseline ${ESLINT_ERROR_BASELINE} — new correctness-lint debt is not allowed. Fix the new error(s) or, if intentional, justify and update ESLINT_ERROR_BASELINE in ci.yml."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **${ERRORS} > ${ESLINT_ERROR_BASELINE}** — new ESLint errors introduced." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "${ERRORS}" -lt "${ESLINT_ERROR_BASELINE}" ]; then
            echo "::warning::ESLint error count ${ERRORS} is BELOW baseline ${ESLINT_ERROR_BASELINE} — lower ESLINT_ERROR_BASELINE in ci.yml to lock in the win."
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⬇️ **${ERRORS} < ${ESLINT_ERROR_BASELINE}** — ratchet the baseline down to lock in the cleanup." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "✅ No new ESLint errors." >> "$GITHUB_STEP_SUMMARY"
          fi

  # ── Hard gate: CDK synth (backend) for the dev environment ───────────────
  infra-checks:
    name: Infra Build + CDK Synth
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install infra dependencies
        run: npm ci

      - name: Build infra TypeScript
        run: npm run build

      - name: CDK synth (backend, dev context — frontend needs OpenNext artifacts)
        run: npm run cdk -- synth -c env=dev ChapterFlowBackend-dev

  # ── Hard gate: no committed build artifacts or hardcoded secrets ─────────
  # Public repo. A committed Turbopack cache once leaked a live Stripe key;
  # this is the un-bypassable backstop for the local pre-commit hook.
  secret-artifact-scan:
    name: Secret & Artifact Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify detection patterns (selftest)
        run: bash scripts/ci/scan-secrets-and-artifacts.sh --selftest

      - name: Scan tracked files for secrets & artifacts
        run: bash scripts/ci/scan-secrets-and-artifacts.sh --all

  # ── Hard gate: design-system / token drift ──────────────────────────────
  # ESLint is advisory and `next build` does not lint, so this standalone guard
  # is the enforcement path for: dead Tailwind v4 `-[--x]` syntax, undeclared
  # --cf-/--cr- tokens, raw hex/rgba in components & app/book, and literal
  # catalog counts. (c)+(d) are baselined (style-drift-allowlist.txt) so only
  # NEW drift blocks. Add this job to branch-protection required checks.
  style-drift-scan:
    name: Style & Token Drift Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Verify detection patterns (selftest)
        run: node scripts/ci/scan-style-drift.mjs --selftest

      - name: Scan tracked files for style/token drift
        run: node scripts/ci/scan-style-drift.mjs --all
