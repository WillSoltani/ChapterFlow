name: ChapterFlow V25 Pipeline

on:
  pull_request:
    paths:
      - "scripts/book/prompts/chapterflow-v24-author-pipeline/**"
      - "docs/v25/reports/**"
      - ".agents/skills/chapterflow-book-evaluator/**"
      - ".github/workflows/chapterflow-v25-pipeline.yml"
  push:
    branches:
      - feat/v25-pipeline-live
    paths:
      - "scripts/book/prompts/chapterflow-v24-author-pipeline/**"
      - "docs/v25/reports/**"
      - ".agents/skills/chapterflow-book-evaluator/**"
      - ".github/workflows/chapterflow-v25-pipeline.yml"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: chapterflow-v25-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v25-pipeline:
    name: V25 Pipeline Typecheck, Contracts, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CHAPTERFLOW_NO_API_CODEX_QC: "1"
      CHAPTERFLOW_ALLOW_MODEL_GEN: "0"
      OPENAI_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      npm_config_cache: /tmp/npm-cache-v25
    defaults:
      run:
        working-directory: scripts/book/prompts/chapterflow-v24-author-pipeline

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # IMP-23 requires this branch to remain an exact reconstruction from
          # the frozen IMP-20 base. Root CI still validates GitHub's merge SHA;
          # this dedicated gate validates the auditable V25 branch bytes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # IMP-24B's pre-live freeze compares the current contract inventory
          # with the owner-pinned starting commit. Keep that object reachable
          # as the lifecycle advances beyond the implementation checkpoint.
          fetch-depth: 0

      - name: Setup Node.js 20.20.0
        uses: actions/setup-node@v6
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: scripts/book/prompts/chapterflow-v24-author-pipeline/package-lock.json

      - name: Install V25 pipeline dependencies
        run: npm ci --include=optional

      - name: Secret and artifact scan
        working-directory: .
        run: bash scripts/ci/scan-secrets-and-artifacts.sh --all

      - name: Active-code private-path scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          root="scripts/book/prompts/chapterflow-v24-author-pipeline"
          if git grep -n -E '(/Users/[^/[:space:]]+|/home/[^/[:space:]]+)' -- \
            "$root/src" \
            "$root/config" \
            "$root/package.json" \
            ":(exclude)$root/src/scratch/**"; then
            echo "Active V25 code contains an absolute private path."
            exit 1
          fi

      - name: Merge-marker scan
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            scripts/book/prompts/chapterflow-v24-author-pipeline \
            docs/v25/reports \
            .agents/skills/chapterflow-book-evaluator; then
            echo "Merge markers found in the V25 scope."
            exit 1
          fi

      - name: Type-check
        run: npx tsc -p . --noEmit

      - name: Validate contracts
        run: node --import tsx src/cli.ts contract-validate

      - name: Prepare disposable full-suite worktree
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          suite_root="${RUNNER_TEMP}/chapterflow-v25-suite"
          # The live/activation boundary intentionally requires the exact
          # authorized branch identity. The Actions checkout is detached
          # because it is pinned to an exact SHA, so give only the disposable
          # suite worktree the truthful branch name at those same bytes.
          git worktree add -B feat/v25-pipeline-live "$suite_root" HEAD
          npm ci --include=optional --prefix "$suite_root/scripts/book/prompts/chapterflow-v24-author-pipeline"

      - name: Run full no-API suite in disposable worktree
        working-directory: ${{ runner.temp }}/chapterflow-v25-suite/scripts/book/prompts/chapterflow-v24-author-pipeline
        run: npx tsx tests/run.ts

      - name: Prove disposable suite invoked no live route
        if: ${{ always() }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          suite_pipeline="${RUNNER_TEMP}/chapterflow-v25-suite/scripts/book/prompts/chapterflow-v24-author-pipeline"
          if find "$suite_pipeline/logs/exec" -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected live-route evidence exists in the disposable suite worktree."
            exit 1
          fi

      - name: Remove disposable full-suite worktree
        if: ${{ always() }}
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          suite_root="${RUNNER_TEMP}/chapterflow-v25-suite"
          if [[ -d "$suite_root" ]]; then
            git worktree remove --force "$suite_root"
          fi
          git branch -D feat/v25-pipeline-live 2>/dev/null || true

      - name: Verify legacy campaign closure
        run: node --import tsx src/cli.ts migration-bakeoff close-legacy-campaign --json

      # Explicit seal-lifecycle identities (V25 recovery): the imp24f ACTIVE
      # CANDIDATE seal is verified against current checkout bytes; the retained
      # imp24 HISTORICAL seal is verified by self-hash + recorded binding only.
      - name: Verify production instrument seal lifecycle (candidate imp24f + historical imp24)
        run: node --import tsx src/cli.ts migration-bakeoff forward-verify-production-instrument-seal-v2 --json

      - name: Verify historical IMP-24C r1 closure and IMP-24D observability freeze read-only
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx src/cli.ts migration-bakeoff imp24-materialize-thresholds --json
          # imp24-certify-instrument verifies BOTH generations by name: the
          # retained imp24 predecessor as history (self-hash/pins only) and the
          # imp24f active candidate against current checkout bytes.
          node --import tsx src/cli.ts migration-bakeoff imp24-certify-instrument --json
          smoke_report="../../../../docs/v25/reports/IMP-24D_TRANSPORT_SMOKE_RESULT.json"
          if [[ -f "$smoke_report" ]]; then
            observability_commit="$(jq -r '.observabilityImplementationCommit // empty' "$smoke_report")"
          else
            observability_commit=""
          fi
          if [[ "$observability_commit" =~ ^[0-9a-f]{40}$ ]] && [[ "$observability_commit" != "$GITHUB_SHA" ]]; then
            node --import tsx src/cli.ts migration-bakeoff imp24-materialize-observability-freeze \
              --verify-historical --observability-commit "$observability_commit" --json
          else
            node --import tsx src/cli.ts migration-bakeoff imp24-materialize-observability-freeze --verify --json
          fi

      - name: Verify IMP-24C terminal attestation read-only when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_report="../../../../docs/v25/reports/IMP-24C_FINAL_REPORT.json"
          if [[ -f "$final_report" ]]; then
            node --import tsx src/cli.ts migration-bakeoff imp24-materialize-final-attestation --verify-retained --json
          fi

      - name: Verify IMP-24D final attestation read-only when present
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          final_report="../../../../docs/v25/reports/IMP-24D_FINAL_REPORT.json"
          if [[ -f "$final_report" ]]; then
            node --import tsx src/cli.ts migration-bakeoff imp24d-materialize-final-attestation --verify-retained --json
          fi

      - name: Prove no live route was invoked
        shell: bash
        run: |
          set -euo pipefail
          if find logs/exec -type f -print -quit 2>/dev/null | grep -q .; then
            echo "Unexpected live-route evidence exists under logs/exec."
            exit 1
          fi

      - name: Require a clean worktree
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            echo "$status"
            echo "V25 validation left unexpected worktree changes."
            exit 1
          fi
