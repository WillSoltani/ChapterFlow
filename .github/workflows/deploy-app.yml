name: Deploy App (Dev)

# Deploys the Next.js application via OpenNext to Lambda + CloudFront.
# Infrastructure (CDK backend) and book data are handled by their own workflows.
#
# Flow: CI passes → build Next.js → build OpenNext → CDK deploy frontend
# stack → invalidate CloudFront cache → verify health.

on:
  push:
    branches:
      - main
    paths-ignore:
      # Skip deploy when ONLY backend infra or book-data scripts changed —
      # those have their own workflows. Frontend infra changes (the CDK
      # stack this workflow deploys) SHOULD trigger a deploy.
      - 'infra/lib/chapterflow-backend-stack.ts'
      - 'scripts/book/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even if no code changed'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-app-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  CDK_STACK_NAME: ChapterFlowFrontend

jobs:
  # ── Gate: ensure the app builds cleanly ──────────────────────────────────
  verify-build:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js
        run: npm run build

  # ── Deploy: OpenNext → Lambda + CloudFront via CDK ──────────────────────
  deploy-app:
    name: Deploy to Lambda/CloudFront
    runs-on: ubuntu-latest
    needs: [verify-build]
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci --prefix infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_DEV }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build OpenNext (includes Next.js build)
        run: npx open-next build

      - name: CDK deploy frontend stack
        working-directory: infra
        run: npx cdk deploy ${{ env.CDK_STACK_NAME }} --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          # App config
          CHAPTERFLOW_APP_BASE_URL: ${{ secrets.CHAPTERFLOW_APP_BASE_URL }}
          CHAPTERFLOW_DOMAIN_NAME: ${{ secrets.CHAPTERFLOW_DOMAIN_NAME }}
          # Cognito
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_REDIRECT_URI: ${{ secrets.COGNITO_REDIRECT_URI }}
          COGNITO_LOGOUT_REDIRECT_URI: ${{ secrets.COGNITO_LOGOUT_REDIRECT_URI }}
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          AUTH_COOKIE_DOMAIN: ${{ secrets.AUTH_COOKIE_DOMAIN }}
          # Stripe
          BOOK_STRIPE_SECRET_KEY: ${{ secrets.BOOK_STRIPE_SECRET_KEY }}
          BOOK_STRIPE_WEBHOOK_SECRET: ${{ secrets.BOOK_STRIPE_WEBHOOK_SECRET }}
          BOOK_STRIPE_PRICE_ID: ${{ secrets.BOOK_STRIPE_PRICE_ID }}
          BOOK_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.BOOK_STRIPE_PRICE_ID_ANNUAL }}
          BOOK_STRIPE_PRICE_ID_ANNUAL_UPFRONT: ${{ secrets.BOOK_STRIPE_PRICE_ID_ANNUAL_UPFRONT }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      - name: Get CloudFront distribution ID
        id: cf
        run: |
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CDK_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"

          DIST_DOMAIN=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.CDK_STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomain'].OutputValue" \
            --output text)
          echo "distribution_domain=${DIST_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cf.outputs.distribution_id }}" \
            --paths "/*"
          echo "CloudFront cache invalidation triggered"

      - name: Health check
        run: |
          # Use custom domain if available, otherwise CloudFront domain
          APP_URL="${{ secrets.CHAPTERFLOW_APP_BASE_URL }}"
          if [ -z "${APP_URL}" ]; then
            APP_URL="https://${{ steps.cf.outputs.distribution_domain }}"
          fi

          echo "Running health check against ${APP_URL}..."

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            --retry 3 \
            --retry-delay 10 \
            "${APP_URL}/")

          echo "Health check response: HTTP ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 400 ]; then
            echo "Health check PASSED"
          else
            echo "Health check FAILED — got HTTP ${HTTP_STATUS}"
            exit 1
          fi

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Detail | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Commit** | \`${GITHUB_SHA::8}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Branch** | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **CloudFront** | ${{ steps.cf.outputs.distribution_domain }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Stack** | ${{ env.CDK_STACK_NAME }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Triggered by** | ${GITHUB_ACTOR} |" >> "$GITHUB_STEP_SUMMARY"
