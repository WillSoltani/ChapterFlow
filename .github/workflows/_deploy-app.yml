name: Deploy App (reusable)

# Reusable: builds the Next.js app via OpenNext and deploys the CDK FRONTEND
# stack (Lambda + CloudFront) for one environment, invalidates the CDN, then
# runs a BLOCKING health gate (the deploy fails if the app is unhealthy).
# Called by deploy.yml. The environment is the GitHub Environment too, so prod
# inherits its required-reviewer approval and environment-scoped secrets.

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | staging | prod"
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  issues: write # open a deploy-failure issue on prod

concurrency:
  group: deploy-app-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1

jobs:
  # workflow_call inputs are strings, so reject anything outside the three
  # configured GitHub Environments before a deployment job can bind an
  # environment, receive its secrets, or request an OIDC token.
  validate-environment:
    name: Validate deployment environment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Require a configured environment
        run: |
          set -euo pipefail
          case "$DEPLOY_ENVIRONMENT" in
            dev|staging|prod) ;;
            *) echo "::error::invalid environment '$DEPLOY_ENVIRONMENT'"; exit 1 ;;
          esac

  deploy-app:
    name: Frontend stack (${{ inputs.environment }})
    needs: validate-environment
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Resolve env/stack names
        run: |
          set -euo pipefail
          ENV="${{ inputs.environment }}"
          case "$ENV" in
            prod) SUFFIX="" ;;
            dev|staging) SUFFIX="-$ENV" ;;
            *) echo "::error::invalid environment '$ENV'"; exit 1 ;;
          esac
          echo "CHAPTERFLOW_ENV=$ENV" >> "$GITHUB_ENV"
          echo "FRONTEND_STACK=ChapterFlowFrontend${SUFFIX}" >> "$GITHUB_ENV"
          echo "SSM_PREFIX=/chapterflow/$ENV" >> "$GITHUB_ENV"

      - name: Install app dependencies
        run: npm ci

      - name: Install infra dependencies
        run: npm ci --prefix infra

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Bucket names are CDK-auto-generated; resolve them from SSM (the backend
      # stack's published config) so app.ts never relies on hardcoded literals.
      - name: Resolve resource names from SSM
        run: |
          set -euo pipefail
          get() { aws ssm get-parameter --name "$1" --query Parameter.Value --output text; }
          echo "BOOK_INGEST_BUCKET=$(get "$SSM_PREFIX/BOOK_INGEST_BUCKET")" >> "$GITHUB_ENV"
          echo "BOOK_CONTENT_BUCKET=$(get "$SSM_PREFIX/BOOK_CONTENT_BUCKET")" >> "$GITHUB_ENV"
          echo "CHAPTERFLOW_BOOK_TABLE_NAME=$(get "$SSM_PREFIX/BOOK_TABLE_NAME")" >> "$GITHUB_ENV"
          echo "CHAPTERFLOW_BOOK_ANALYTICS_TABLE_NAME=$(get "$SSM_PREFIX/BOOK_ANALYTICS_TABLE_NAME")" >> "$GITHUB_ENV"

      - name: Build OpenNext (includes Next.js build)
        run: npx open-next build
        env:
          # NEXT_PUBLIC_* values are compiled into the browser bundle. They
          # belong at build time and are never injected into the server Lambda.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      # Raw Cognito subject IDs exist only in this process environment. The
      # helper validates canonical UUIDs and writes one-way SHA-256 values to
      # GITHUB_ENV; CDK/CloudFormation/Lambda configuration never receive raw
      # account identifiers. Error output is code-only.
      - name: Derive protected TestFlight QA subject hashes
        env:
          APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED: ${{ vars.APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED || '0' }}
          APPLE_IAP_TESTFLIGHT_QA_USER_IDS: ${{ vars.APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED == '1' && secrets.APPLE_IAP_TESTFLIGHT_QA_USER_IDS || '' }}
        run: |
          set -euo pipefail
          case "$APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED" in
            1)
              HASHES="$(node --import tsx scripts/ci/hash-apple-testflight-qa-users.ts)"
              echo "::add-mask::$HASHES"
              echo "APPLE_IAP_TESTFLIGHT_QA_USER_HASHES=$HASHES" >> "$GITHUB_ENV"
              ;;
            0|"")
              echo "APPLE_IAP_TESTFLIGHT_QA_USER_HASHES=" >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::E_APPLE_IAP_TESTFLIGHT_FLAG_INVALID"
              exit 1
              ;;
          esac

      # The server reads authored book packages from S3 at runtime (quiz/audio/ask)
      # instead of bundling all ~37.6 MB into the ServerFn (which would exceed
      # Lambda's 250 MiB unzipped limit). The packages live at
      # s3://<content-bucket>/book-content/packages/<bookId>.v21.json and are kept
      # in sync OUT OF BAND via scripts/book/upload-book-packages-to-s3.ts, run with
      # a profile that has s3:PutObject on the content bucket. They are NOT uploaded
      # in this workflow: the GitHub OIDC deploy role (ChapterFlowGitHubDeploy) only
      # has CDK/CloudFormation rights, not direct s3:PutObject on the content bucket,
      # so an in-workflow upload fails with AccessDenied.
      # TODO: move this into a CDK BucketDeployment in the frontend stack (which uses
      # its own managed-Lambda role) for automatic in-deploy sync — see PR follow-up.

      - name: CDK deploy frontend stack
        working-directory: infra
        run: npx cdk deploy -c env=${{ env.CHAPTERFLOW_ENV }} "${FRONTEND_STACK}" --exclusively --require-approval never
        env:
          CDK_DEFAULT_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          CHAPTERFLOW_ENV: ${{ env.CHAPTERFLOW_ENV }}
          CHAPTERFLOW_COMMIT_SHA: ${{ github.sha }}
          CHAPTERFLOW_VALIDATE_APPLE_IAP_CONFIG: '1'
          # App + domain
          CHAPTERFLOW_APP_BASE_URL: ${{ secrets.CHAPTERFLOW_APP_BASE_URL }}
          CHAPTERFLOW_DOMAIN_NAME: ${{ secrets.CHAPTERFLOW_DOMAIN_NAME }}
          CHAPTERFLOW_HOSTED_ZONE_ID: ${{ vars.CHAPTERFLOW_HOSTED_ZONE_ID }}
          # Cognito
          COGNITO_DOMAIN: ${{ secrets.COGNITO_DOMAIN }}
          COGNITO_CUSTOM_DOMAIN: ${{ secrets.COGNITO_CUSTOM_DOMAIN }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_REDIRECT_URI: ${{ secrets.COGNITO_REDIRECT_URI }}
          COGNITO_LOGOUT_REDIRECT_URI: ${{ secrets.COGNITO_LOGOUT_REDIRECT_URI }}
          AUTH_COOKIE_DOMAIN: ${{ secrets.AUTH_COOKIE_DOMAIN }}
          # Origin lock (WS6-002). The shared secret CloudFront injects as
          # x-origin-verify and middleware/the image wrapper enforce; prod synth
          # REQUIRES it (>=32 chars — bin/app.ts fails closed without it). For a
          # first observe-only rollout set the environment variable
          # CHAPTERFLOW_ORIGIN_VERIFY_MODE=log (Settings → Environments → <env>
          # → Variables) — mismatches log `origin_verify_mismatch` but requests
          # proceed; after confirming CloudFront traffic carries the header,
          # delete the variable and re-deploy to enforce.
          CHAPTERFLOW_ORIGIN_VERIFY_SECRET: ${{ secrets.CHAPTERFLOW_ORIGIN_VERIFY_SECRET }}
          CHAPTERFLOW_ORIGIN_VERIFY_MODE: ${{ vars.CHAPTERFLOW_ORIGIN_VERIFY_MODE || '' }}
          # StoreKit / native mobile configuration (nonsecret, environment-bound)
          APPLE_IAP_BUNDLE_ID: ${{ vars.APPLE_IAP_BUNDLE_ID }}
          APPLE_IAP_APP_APPLE_ID: ${{ vars.APPLE_IAP_APP_APPLE_ID }}
          APPLE_IAP_SUBSCRIPTION_GROUP_ID: ${{ vars.APPLE_IAP_SUBSCRIPTION_GROUP_ID }}
          IOS_STOREKIT_PRODUCT_IDS: ${{ vars.IOS_STOREKIT_PRODUCT_IDS }}
          IOS_APP_STORE_URL: ${{ vars.IOS_APP_STORE_URL }}
          APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED: ${{ vars.APPLE_IAP_TESTFLIGHT_SANDBOX_ENABLED || '0' }}
          # APPLE_IAP_TESTFLIGHT_QA_USER_HASHES is inherited from GITHUB_ENV
          # after the one-way derivation step; raw subjects never cross CDK.
          # Stripe
          BOOK_STRIPE_PRICE_ID: ${{ secrets.BOOK_STRIPE_PRICE_ID }}
          BOOK_STRIPE_PRICE_ID_ANNUAL: ${{ secrets.BOOK_STRIPE_PRICE_ID_ANNUAL }}
          BOOK_STRIPE_PRICE_ID_ANNUAL_UPFRONT: ${{ secrets.BOOK_STRIPE_PRICE_ID_ANNUAL_UPFRONT }}
          # Same-origin / CSRF guard (#6/#293). Defaults to "1" (ENFORCE) when the
          # variable is unset. Set the environment variable CSRF_ORIGIN_ENFORCE=0
          # (Settings → Environments → <env> → Variables, or `gh variable set
          # CSRF_ORIGIN_ENFORCE --env <env> --body 0`) to bring a deploy up in
          # OBSERVE-ONLY mode — rejections log `csrf_origin_rejected`/
          # `csrf_origin_observe_only` but requests proceed. After confirming no
          # legitimate host trips a 403, delete the variable and re-deploy to enforce.
          CSRF_ORIGIN_ENFORCE: ${{ vars.CSRF_ORIGIN_ENFORCE || '1' }}

      - name: Resolve CloudFront distribution
        id: cf
        run: |
          set -euo pipefail
          DIST_ID=$(aws cloudformation describe-stacks --stack-name "${FRONTEND_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" --output text)
          DIST_DOMAIN=$(aws cloudformation describe-stacks --stack-name "${FRONTEND_STACK}" \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionDomain'].OutputValue" --output text)
          echo "distribution_id=${DIST_ID}" >> "$GITHUB_OUTPUT"
          echo "distribution_domain=${DIST_DOMAIN}" >> "$GITHUB_OUTPUT"

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cf.outputs.distribution_id }}" --paths "/*" \
            --query 'Invalidation.Id' --output text)
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ steps.cf.outputs.distribution_id }}" \
            --id "${INVALIDATION_ID}"

      # BLOCKING health gate — a non-2xx on any critical surface fails the deploy.
      - name: Health gate
        run: |
          set -uo pipefail
          APP_URL="https://${{ steps.cf.outputs.distribution_domain }}"
          echo "Health-checking ${APP_URL} (allowing warm-up)..."
          sleep 10
          fail=0
          for p in "/" "/pricing" "/api/health" "/app/api/book/config/ios"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
              --retry 4 --retry-delay 10 --retry-all-errors "${APP_URL}${p}")
            echo "  ${p} -> HTTP ${code}"
            if [ "${code}" -lt 200 ] || [ "${code}" -ge 400 ]; then
              echo "::error::health check FAILED for ${p} (HTTP ${code})"
              fail=1
            fi
          done
          if [ "${fail}" -ne 0 ]; then
            {
              echo "## ❌ Deploy FAILED health gate — ${{ inputs.environment }}"
              echo ""
              echo "One or more critical surfaces returned non-2xx after deploy."
              echo ""
              echo "### Rollback"
              echo "1. Re-run **Deploy** on the last known-good commit/tag:"
              echo "   \`Actions → Deploy → Run workflow → environment=${{ inputs.environment }}\`, ref = prior good SHA."
              echo "2. OpenNext bundles are immutable per-commit, so redeploying the previous commit restores the prior Lambda + assets."
              echo "3. Stateful resources (DynamoDB/S3) are RETAINed and are NOT rolled back by an app redeploy."
              echo "4. Check CloudWatch logs for the \`${FRONTEND_STACK/Frontend/Server}\` Lambda (env: ${{ inputs.environment }})."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Health gate PASSED" >> "$GITHUB_STEP_SUMMARY"

      # Readiness smoke — probes deep dependency checks (dynamo / catalog /
      # content / billing / auth) and reports them to the job summary.
      #
      # L91: /api/health?deep=1 always returns HTTP 200 (status: "degraded" in
      # the body when a dependency fails), so the health gate above can't catch a
      # degraded dependency. For NON-prod this stays informational
      # (continue-on-error). For PROD this step is BLOCKING: a degraded auth /
      # billing / content / catalog / dynamo dependency FAILS the deploy instead
      # of merely being tabled, so launch-blocker regressions cannot reach live
      # users behind a green deploy. (An unreachable endpoint -> empty body ->
      # status "unknown" also fails prod.)
      - name: Readiness smoke (deep)
        continue-on-error: ${{ inputs.environment != 'prod' }}
        run: |
          set -uo pipefail
          APP_URL="https://${{ steps.cf.outputs.distribution_domain }}"
          body=$(curl -s --max-time 25 --retry 2 --retry-delay 5 --retry-all-errors \
            "${APP_URL}/api/health?deep=1" || echo '{}')
          echo "Deep health: ${body}"
          status=$(echo "${body}" | jq -r '.status // "unknown"')
          blocking="${{ inputs.environment == 'prod' && 'true' || 'false' }}"
          {
            echo "### Readiness smoke (status: \`${status}\`, blocking: \`${blocking}\`)"
            echo ""
            echo "| Check | OK |"
            echo "|-------|----|"
            echo "${body}" | jq -r '(.checks // {}) | to_entries[] | "| \(.key) | \(if .value then "✅" else "❌" end) |"'
          } >> "$GITHUB_STEP_SUMMARY" || true
          if [ "${blocking}" = "true" ] && [ "${status}" != "ok" ]; then
            echo "::error::prod readiness FAILED — deep health status is '${status}' (expected 'ok'). A critical dependency (auth/billing/content/catalog/dynamo) is degraded; failing the deploy."
            {
              echo ""
              echo "❌ **Prod readiness gate FAILED** — deep health status \`${status}\`."
              echo "A critical dependency is degraded. See the table above for the failing check, then re-deploy once resolved (or roll back per the health-gate rollback steps)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## ✅ App deploy — ${{ inputs.environment }}"
            echo ""
            echo "| Detail | Value |"
            echo "|--------|-------|"
            echo "| Stack | \`${FRONTEND_STACK}\` |"
            echo "| CloudFront | ${{ steps.cf.outputs.distribution_domain }} |"
            echo "| Commit | \`${GITHUB_SHA::8}\` |"
            echo "| Triggered by | ${GITHUB_ACTOR} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # GitHub-native failure notification for prod (built-in failed-run emails
      # cover the rest). Dedupes by title so retries update one issue.
      - name: Open deploy-failure issue (prod only)
        if: failure() && inputs.environment == 'prod'
        uses: actions/github-script@v9
        with:
          script: |
            const title = `🚨 Prod deploy failed (${context.sha.substring(0,8)})`;
            const body = [
              `Prod deploy failed in run ${context.runId}.`,
              ``,
              `- Commit: ${context.sha}`,
              `- Actor: ${context.actor}`,
              `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ``,
              `**Rollback:** re-run Deploy on the previous good commit/tag (env=prod).`,
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "deploy-failure", per_page: 100,
            });
            const dup = existing.data.find((i) => i.title === title);
            if (dup) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: dup.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["deploy-failure"],
              });
            }
